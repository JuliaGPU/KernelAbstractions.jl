name: CI-KA

on:
  push:
    branches:
      - main
      - release-*
    tags: '*'
  pull_request:

defaults:
  run:
    shell: bash

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  CI:
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13', 'nightly']
        os: [ubuntu-24.04, ubuntu-24.04-arm, macOS-15-intel, macOS-15, windows-2022]
        arch: [x64, arm64]
        exclude:
          - os: ubuntu-24.04
            arch: arm64
          - os: windows-2022
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: x64
          - os: macOS-15-intel
            arch: arm64
          - os: macOS-15
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Known limitation: `[sources]` is only supported from Julia 1.11 on, so on 1.10
      # the `KernelInterface = {path = "lib/KernelInterface"}` entry in Project.toml is
      # silently ignored and Pkg resolves KernelInterface from the registry instead --
      # a stale release that need not have the features this repo's copy adds. Dev it
      # explicitly so 1.10 tests the copy in this repo, like 1.11+ already do.
      #
      # Required on every platform. Windows runs its tests de-escalated below, but that
      # applies to the test run only, not to `Pkg.develop`. Do this before building, which
      # already resolves the environment (and fails if this repo requires an unregistered
      # version of KernelInterface).
      - name: Dev KernelInterface
        shell: bash
        run: julia -e 'using Pkg; Pkg.activate("."); Pkg.develop(; path="lib/KernelInterface")'
      # Nightly tracks the next Julia release; don't fail CI on it
      - uses: julia-actions/julia-buildpkg@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}
      - uses: julia-actions/julia-runtest@v1
        if: runner.os != 'Windows'
        continue-on-error: ${{ matrix.version == 'nightly' }}
        with:
          annotate: true
      - name: Setup BusyBox
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            try {
              Invoke-WebRequest https://frippery.org/files/busybox/busybox64.exe -OutFile C:\Windows\drop.exe
              break
            } catch {
              if ($i -eq $attempts) { throw }
              Write-Host "Download failed (attempt $i/$attempts): $($_.Exception.Message). Retrying in 10s..."
              Start-Sleep -Seconds 10
            }
          }
      - name: Test KernelAbstractions.jl (de-escalated)
        if: runner.os == 'Windows'
        continue-on-error: ${{ matrix.version == 'nightly' }}
        shell: drop -c "julia '{0}'"
        run: |
          using Pkg
          Pkg.activate(".")
          Pkg.test()
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info

  KernelInterface:
    name: KernelInterface
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13', 'nightly']
        os: [ubuntu-24.04, macOS-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # Tested on its own, without KernelAbstractions, to keep the sibling
      # package standalone and dependency-free.
      - uses: julia-actions/julia-buildpkg@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}
        with:
          project: lib/KernelInterface
      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}
        with:
          project: lib/KernelInterface
          annotate: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: "Instantiate docs environment"
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
      - name: "Build docs"
        run: |
          julia --project=docs --color=yes docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Upload build artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build
          name: docs-build

  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: "Run doctests"
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()

          using Documenter: doctest
          using KernelAbstractions
          doctest(KernelAbstractions; manual = true)
