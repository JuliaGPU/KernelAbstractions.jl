# Tests of the KernelAbstractions-related parts of the GPU back-ends. Draft pull requests skip
# them, unless selected by name in the last commit message: `[only cuda]`, `[only metal, oneapi]`
# or `[only tests]` for all of them. `[skip amdgpu]` or `[skip tests]` does the opposite.
# (`opencl` selects the OpenCL.jl tests, on PoCL and on CUDA hardware.)
#
# A back end whose branch can't be installed together with this KernelAbstractions (e.g.
# because it doesn't support this KernelInterface yet) soft-fails with exit status 3,
# instead of failing the build; test failures still fail it.
steps:
  - label: "CUDA Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop([PackageSpec(; name="KernelAbstractions", path=pwd()),
                PackageSpec(; name="KernelInterface", path=joinpath(pwd(), "lib", "KernelInterface"))])' || exit 3
      echo "--- :julia: Developing CUDA"
      julia .buildkite/develop_backend.jl https://github.com/JuliaGPU/CUDA.jl ka-0.10 \
            CUDACore CUDATools lib/cusolver lib/curand lib/cublas lib/cufft lib/cusparse lib/cupti lib/nvml lib/custatevec lib/cudnn lib/cutensor lib/cutensornet || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                check = joinpath(pwd(), ".buildkite", "check_sources.jl")
                Pkg.test("CUDA"; test_fn=() -> include(check), coverage=true, test_args=["core/kernelabstractions", "core/kernelinterface"])'
    agents:
      queue: "cuda"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
      (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_PROJECT: "@cuda"

  - label: "Metal Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop([PackageSpec(; name="KernelAbstractions", path=pwd()),
                PackageSpec(; name="KernelInterface", path=joinpath(pwd(), "lib", "KernelInterface"))])' || exit 3
      echo "--- :julia: Developing Metal"
      julia .buildkite/develop_backend.jl https://github.com/JuliaGPU/Metal.jl ka-0.10 || exit 3
      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                check = joinpath(pwd(), ".buildkite", "check_sources.jl")
                Pkg.test("Metal"; test_fn=() -> include(check), coverage=true, test_args=["kernelabstractions", "kernelinterface"])'
    agents:
      queue: "metal"
    if: |
      build.message !~ /\[skip [^\]]*(tests|metal)/ &&
      (build.message =~ /\[only [^\]]*(tests|metal)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_PROJECT: "@metal"

  - label: "oneAPI Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop([PackageSpec(; name="KernelAbstractions", path=pwd()),
                PackageSpec(; name="KernelInterface", path=joinpath(pwd(), "lib", "KernelInterface"))])' || exit 3
      julia -e 'println("--- :julia: Developing oneAPI")
                using Pkg
                Pkg.add(url="https://github.com/JuliaGPU/AcceleratedKernels.jl", rev="main")' || exit 3
      julia .buildkite/develop_backend.jl https://github.com/JuliaGPU/oneAPI.jl ka-0.10 || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                check = joinpath(pwd(), ".buildkite", "check_sources.jl")
                Pkg.test("oneAPI"; test_fn=() -> include(check), coverage=true, test_args=["kernelabstractions", "kernelinterface"])'
    agents:
      queue: "oneapi"
    if: |
      build.message !~ /\[skip [^\]]*(tests|oneapi)/ &&
      (build.message =~ /\[only [^\]]*(tests|oneapi)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_PROJECT: "@oneAPI"

  - label: "AMDGPU Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e '
                using Pkg
                println("--- :julia: Instantiating project")
                Pkg.develop([PackageSpec(; name="KernelAbstractions", path=pwd()),
                PackageSpec(; name="KernelInterface", path=joinpath(pwd(), "lib", "KernelInterface"))])' || exit 3
      julia -e 'println("--- :julia: Developing AMDGPU")
                using Pkg
                Pkg.add(url="https://github.com/JuliaGPU/AcceleratedKernels.jl", rev="main")' || exit 3
      julia .buildkite/develop_backend.jl https://github.com/JuliaGPU/AMDGPU.jl ka-0.10 || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                check = joinpath(pwd(), ".buildkite", "check_sources.jl")
                Pkg.test("AMDGPU"; test_fn=() -> include(check), coverage=true, test_args=["kernelabstractions", "kernelinterface"])'
    agents:
      queue: "rocm"
    if: |
      build.message !~ /\[skip [^\]]*(tests|amdgpu)/ &&
      (build.message =~ /\[only [^\]]*(tests|amdgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_PROJECT: "@amdgpu"
      JULIA_NUM_THREADS: 4

  - label: "OpenCL Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop([PackageSpec(; name="KernelAbstractions", path=pwd()),
                PackageSpec(; name="KernelInterface", path=joinpath(pwd(), "lib", "KernelInterface"))])' || exit 3
      echo "--- :julia: Developing OpenCL"
      julia .buildkite/develop_backend.jl https://github.com/JuliaGPU/OpenCL.jl ka-0.10 lib/intrinsics || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                check = joinpath(pwd(), ".buildkite", "check_sources.jl")
                tests = ["$(target)/$(test)" for target in ("pocl", "poclc", "nvidia")
                                                 for test in ("kernelabstractions", "kernelinterface")]
                Pkg.test("OpenCL"; test_fn=() -> include(check), coverage=true, test_args=tests)'
    agents:
      queue: "cuda"
    if: |
      build.message !~ /\[skip [^\]]*(tests|opencl)/ &&
      (build.message =~ /\[only [^\]]*(tests|opencl)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      OCL_ICD_FILENAMES: "libnvidia-opencl.so.1"
      JULIA_PROJECT: "@OpenCL"

env:
  JULIA_PKG_PRECOMPILE_AUTO: false
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: "eager" # see freshly-registered versions without cloning the registry
